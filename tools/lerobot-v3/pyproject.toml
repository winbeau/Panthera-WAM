[project]
name = "panthera-lerobot-v3"
version = "0.1.0"
description = "Pinned LeRobotDataset v3 producer for Panthera staging episodes"
requires-python = ">=3.10,<3.11"
dependencies = [
  "lerobot==0.4.4",
  "pyarrow==25.0.1",
  "torch==2.7.1+cpu",
  "torchvision==0.22.1+cpu",
]

[project.scripts]
panthera-create-lerobot-fixture = "panthera_lerobot_v3.fixture:main"
panthera-pack-lerobot-v3 = "panthera_lerobot_v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panthera_lerobot_v3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "pytest==8.4.2",
]
